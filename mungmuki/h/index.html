<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>뭉무키 꿀 포인트</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eef8f5;color:#053943;font-family:system-ui,-apple-system,sans-serif;line-height:1.55}
    main{width:min(100%,480px);margin:0 auto;padding:28px 20px 36px}.hero{background:#087f83;color:#fff;border-radius:26px;padding:24px;box-shadow:0 10px 30px #05394312}
    .brand{display:flex;align-items:center;gap:16px;margin-bottom:22px}.face{flex:none;width:66px;height:70px;background:url(brand_logo.png) -234px -2.5px/300px 82px no-repeat}.word{width:156px;height:56px;object-fit:contain}
    .eyebrow{font-size:13px;margin:0;color:#d2efec}h1{font-size:26px;letter-spacing:-.8px;line-height:1.3;margin:8px 0 0}.card{background:#fff;border-radius:24px;padding:24px;margin-top:18px;box-shadow:0 6px 24px #05394309}
    .category{display:inline-block;border-radius:999px;padding:5px 13px;background:#fff2d6;color:#725100;font-weight:750;font-size:14px}#memo{font-size:21px;font-weight:750;line-height:1.5;margin:18px 0;overflow-wrap:anywhere;white-space:pre-wrap}.description{font-size:14px;color:#54716f;margin:0}
    .actions{margin-top:24px;display:grid;gap:12px}.button{display:block;text-align:center;text-decoration:none;font-size:16px;font-weight:750;border-radius:16px;padding:16px 10px;min-height:56px}.primary{background:#087f83;color:#fff}.secondary{background:#fff;color:#04727c;border:1px solid #a7d2ce}.button:focus-visible,a:focus-visible{outline:3px solid #f4a61d;outline-offset:4px}.button:active{transform:translateY(1px)}
    .note{font-size:13px;color:#54716f;margin:16px 4px 0}.note a{color:#04727c}#error{margin:0;color:#725100;background:#fff2d6;border-radius:16px;padding:18px}footer{font-size:12px;color:#718c88;text-align:center;margin-top:26px}[hidden]{display:none!important}
    @media(max-width:350px){main{padding:18px 14px}.hero,.card{padding:20px}.word{width:136px}h1{font-size:24px}}
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div class="brand"><span class="face" role="img" aria-label="뭉무키 얼굴"></span><img class="word" src="brand_text_white.png" alt="뭉무키" width="156" height="56"></div>
      <p class="eyebrow">함께 나눈 배달 길의 작은 도움</p>
      <h1>뭉무키 꿀 포인트</h1>
    </header>
    <section class="card" aria-label="받은 장소">
      <p id="error" role="alert">공유 주소를 확인해 주세요. 올바른 링크를 다시 열어 주세요.</p>
      <div id="details" hidden><span id="category" class="category"></span><p id="memo"></p><p class="description">앱에서 받은 곳으로 확인하고, 원하면 내 꿀에 저장하세요.</p></div>
    </section>
    <div id="actions" class="actions" hidden>
      <a id="open-app" class="button primary" hidden>뭉무키 앱에서 보기</a>
      <a id="open-map" class="button secondary" rel="noreferrer">카카오맵으로 보기</a>
    </div>
    <p id="android-note" class="note" hidden>앱이 없다면 Google Play로 이동해요. 열리지 않으면 <a id="android-store" rel="noreferrer">Google Play에서 확인하세요.</a></p>
    <p id="desktop-note" class="note" hidden>Android용 뭉무키 앱은 <a id="store" rel="noreferrer">Google Play에서 확인하세요.</a></p>
    <footer>배달 기사를 위한 기록 앱, 뭉무키</footer>
  </main>
  <script>
    'use strict';
    const STORE_URL='https://play.google.com/store/apps/details?id=kr.nitro.mungmuki';
    const CATEGORIES={rest:'🪑 쉼터',toilet:'🚻 화장실',food:'🍜 밥집',wait:'⏳ 대기 자리',charge:'🔌 충전',etc:'⭐ 기타'};
    function parseSpot(hash){
      if(typeof hash!=='string'||!hash.startsWith('#')||hash.length>2048)return null;
      try{
        const fields=new Map();
        for(const part of hash.slice(1).split('&')){
          const at=part.indexOf('=');if(at<1)return null;
          const key=decodeURIComponent(part.slice(0,at).replace(/\+/g,' ')),value=decodeURIComponent(part.slice(at+1).replace(/\+/g,' '));
          if(!['lat','lng','c','m'].includes(key)||fields.has(key))return null;fields.set(key,value);
        }
        const lat=fields.get('lat'),lng=fields.get('lng'),cat=fields.get('c'),memo=fields.get('m')||'';
        if(!lat||!lng||lat.trim()!==lat||lng.trim()!==lng||!Number.isFinite(Number(lat))||!Number.isFinite(Number(lng))||Math.abs(Number(lat))>90||Math.abs(Number(lng))>180||!Object.hasOwn(CATEGORIES,cat)||[...memo].length>40||/[\u0000-\u0009\u000b-\u001f\u007f-\u009f]/.test(memo))return null;
        return {lat:Number(lat),lng:Number(lng),cat,memo};
      }catch{return null}
    }
    function appIntent(spot){
      const query=`lat=${encodeURIComponent(spot.lat)}&lng=${encodeURIComponent(spot.lng)}&cat=${encodeURIComponent(spot.cat)}&memo=${encodeURIComponent(spot.memo)}`;
      return `intent://honey?${query}#Intent;scheme=mungmuki;package=kr.nitro.mungmuki;S.browser_fallback_url=${encodeURIComponent(STORE_URL)};end`;
    }
    function render(){
      const node=id=>document.getElementById(id),spot=location.search?null:parseSpot(location.hash),android=/Android/i.test(navigator.userAgent);
      for(const id of ['details','actions','open-app','android-note','desktop-note'])node(id).hidden=true;
      for(const id of ['open-app','open-map','store','android-store'])node(id).removeAttribute('href');
      node('error').hidden=!!spot;if(!spot)return;
      node('category').textContent=CATEGORIES[spot.cat];node('memo').textContent=spot.memo||'함께 나눈 위치예요';
      node('details').hidden=false;node('actions').hidden=false;
      node('open-map').href=`https://map.kakao.com/link/map/MUNGMUKI,${spot.lat.toFixed(5)},${spot.lng.toFixed(5)}`;
      if(android){node('open-app').href=appIntent(spot);node('open-app').hidden=false;node('android-store').href=STORE_URL;node('android-note').hidden=false}
      else{node('store').href=STORE_URL;node('desktop-note').hidden=false}
    }
    window.addEventListener('hashchange',render);render();
  </script>
</body>
</html>
